  <h1>Support — Nestbook</h1>
  <p class="meta">A family notebook: one place to follow your children and yourself, with no account and no server.</p>
  <p class="lang"><a href="#english">English</a><a href="#tieng-viet">Tiếng Việt</a></p>

  <h2 id="english">1. Getting help</h2>
  <p>Email <a href="mailto:thaidv@thaidang.net">thaidv@thaidang.net</a>. Nestbook is made by one person, so replies take a day or two rather than minutes.</p>
  <p>The app can write the mail for you: <strong>Settings → Report a problem</strong> fills in the app version, your iOS version and your device model, and nothing else. It attaches no profile names, no entries and no photographs.</p>

  <h2>2. Why don't I see the AI features?</h2>
  <p>Filling a form from a spoken or typed sentence, the weekly summary, and reading a photographed report card all run on Apple Intelligence, which needs an iPhone 15 Pro or newer. On a device that cannot run it, Nestbook hides those parts rather than showing buttons that would not work. Everything else is unchanged.</p>

  <h2>3. My data isn't on my other device</h2>
  <p>Sync goes through your own iCloud, so both devices must be signed in to the same Apple Account with iCloud Drive on, and Nestbook's own sync switch must be on (<strong>Settings → iCloud sync</strong>). Nothing syncs while a device is offline; open the app once each side is back on the network.</p>

  <h2>4. I bought Pro but it isn't unlocked</h2>
  <p><strong>Settings → Restore purchase.</strong> Purchases belong to the Apple Account that bought them, so use the same one. Pro is a single purchase, kept forever — there is nothing to renew.</p>

  <h2>5. How do I get my data out?</h2>
  <p><strong>Settings → Export everything</strong> writes a zip containing your data and your photographs. A single project can also be shared as a readable text file, anonymised by default. The free version can always view and export everything already entered — a limit never locks your own data.</p>

  <h2>6. Is any of this medical advice?</h2>
  <p>No. Nestbook is a notebook for keeping records, not a medical device. It does not diagnose anything. Growth charts show published WHO or CDC reference channels for comparison only. If a number or a trend worries you, talk to your doctor.</p>

  <h2>7. Privacy</h2>
  <p>Nestbook collects nothing. The full policy is here: <a href="privacy.html">Privacy Policy — Nestbook</a>.</p>

  <h2 id="tieng-viet">Hỗ trợ — Nestbook</h2>
  <p class="meta">Sổ tay gia đình: một chỗ để theo dõi các con và chính bạn, không cần tài khoản, không có server.</p>

  <h2>1. Cần giúp</h2>
  <p>Gửi thư tới <a href="mailto:thaidv@thaidang.net">thaidv@thaidang.net</a>. Nestbook do một người làm, nên thư trả lời tính bằng ngày chứ không bằng phút.</p>
  <p>App viết thư giúp bạn: <strong>Cài đặt → Báo lỗi</strong> điền sẵn phiên bản app, phiên bản iOS và model máy, và không gì khác. Nó không kèm tên hồ sơ, không kèm entry, không kèm ảnh.</p>

  <h2>2. Sao tôi không thấy tính năng AI?</h2>
  <p>Phần điền form từ một câu nói hoặc gõ, bản tổng kết tuần, và đọc ảnh phiếu điểm đều chạy bằng Apple Intelligence, cần iPhone 15 Pro trở lên. Máy không chạy được thì Nestbook ẩn những phần đó đi thay vì hiện nút bấm không ăn. Mọi thứ còn lại không đổi.</p>

  <h2>3. Dữ liệu không có trên máy kia</h2>
  <p>Đồng bộ đi qua iCloud của chính bạn, nên cả hai máy phải đăng nhập cùng Apple Account và bật iCloud Drive, và công tắc đồng bộ của Nestbook phải bật (<strong>Cài đặt → Đồng bộ iCloud</strong>). Máy đang offline thì không đồng bộ gì; có mạng rồi thì mở app một lần ở mỗi máy.</p>

  <h2>4. Tôi mua Pro rồi mà chưa mở</h2>
  <p><strong>Cài đặt → Khôi phục giao dịch.</strong> Giao dịch thuộc về Apple Account đã mua, nên hãy dùng đúng tài khoản đó. Pro là một lần mua, giữ mãi — không có gì phải gia hạn.</p>

  <h2>5. Lấy dữ liệu ra thế nào?</h2>
  <p><strong>Cài đặt → Xuất toàn bộ</strong> tạo một file zip gồm dữ liệu và ảnh của bạn. Một project cũng chia sẻ được thành file văn bản đọc được, mặc định đã ẩn danh. Bản miễn phí luôn xem và xuất được mọi thứ đã nhập — giới hạn không bao giờ khoá dữ liệu của bạn.</p>

  <h2>6. Đây có phải tư vấn y tế không?</h2>
  <p>Không. Nestbook là sổ tay để ghi chép, không phải thiết bị y tế. Nó không chẩn đoán bất cứ điều gì. Biểu đồ tăng trưởng chỉ hiện dải tham chiếu WHO hoặc CDC đã công bố để so sánh. Con số hay xu hướng nào làm bạn lo, hãy trao đổi với bác sĩ.</p>

  <h2>7. Quyền riêng tư</h2>
