  <h1>Privacy Policy — Nestbook</h1>
  <p class="meta">Last updated: 14 August 2026</p>
  <p class="lang"><a href="#english">English</a><a href="#tieng-viet">Tiếng Việt</a></p>

  <h2 id="english">1. Overview</h2>
  <p>Nestbook collects nothing. There is no account to create, no server of ours for your data to reach, no analytics, and no third-party tracking or advertising code in the app. This policy is short because there is little to describe.</p>
  <p>Nestbook is published by Thai Dang Studio.</p>

  <h2>2. Information we collect</h2>
  <p>None. We do not collect, receive, store or transmit any personal information. We operate no server that the app talks to, and the app contains no analytics or advertising software development kits.</p>

  <h2>3. Information stored on your device</h2>
  <p>Everything you enter stays in a database inside the app on your device:</p>
  <ul>
    <li>the profiles you create, for your children or for yourself, including a name, a date of birth and optionally a sex;</li>
    <li>the projects you create from the built-in templates, and every entry in them — measurements, grades, sessions, practice time, free-text notes;</li>
    <li>photographs you attach to an entry, copied into the app's own storage;</li>
    <li>text the app itself writes, such as a short comment under an entry or a weekly summary;</li>
    <li>your settings, such as units, growth standard and reminder schedules.</li>
  </ul>
  <p>We have no copy of any of it and no way to read it.</p>

  <h2>4. iCloud sync</h2>
  <p>If iCloud sync is switched on for Nestbook, your data is synchronised through <em>your own</em> iCloud account using Apple's CloudKit private database, so other devices signed in to the same Apple Account can see it. That data is handled by Apple under <a href="https://www.apple.com/legal/privacy/">Apple's Privacy Policy</a>. We never receive it. You can turn sync off in the app at any time.</p>
  <p>If the Apple Account on the device changes, Nestbook stops syncing immediately and asks you what to do with the data already on the device. It never moves data between accounts.</p>

  <h2>5. On-device AI</h2>
  <p>On devices that support Apple Intelligence, Nestbook can turn a sentence you speak or type into a filled-in form, write a short comment under an entry, summarise your week, and read numbers out of a photograph. All of it runs on the device using Apple's on-device models. No text, no audio and no image is sent to us or to any server. On a device that cannot run those models, these features are absent and everything else works the same.</p>
  <p>The app fills a form for you to check. It never saves anything without your confirmation.</p>

  <h2>6. Sharing, only when you ask</h2>
  <p>Nestbook never sends anything by itself. When you choose to share a project, it builds a text file and shows you the whole file first. By default that file is anonymised: the real name is replaced, photographs are left out, and the numbers are kept. You then choose where it goes — another app, a message, or an AI assistant of your choice. Once it leaves Nestbook, it is governed by whatever service you sent it to.</p>

  <h2>7. Network access</h2>
  <p>The app makes no network connection of its own. The only network traffic it can cause is to Apple's own services: iCloud, if you enable sync; the App Store, to check whether this Apple Account has bought Nestbook Pro; and Apple's push service, which iCloud uses to tell the device that something changed.</p>

  <h2>8. Permissions</h2>
  <p>Nestbook asks for a permission only at the moment you use the feature that needs it, and it keeps working if you refuse:</p>
  <ul>
    <li>photo library and camera — to attach or photograph a picture;</li>
    <li>microphone and speech recognition — to dictate an entry instead of typing;</li>
    <li>notifications — to remind you to record an entry.</li>
  </ul>

  <h2>9. Purchases</h2>
  <p>Nestbook Pro is a single purchase handled entirely by Apple. We never see your name, your payment details or your Apple Account. The app only asks Apple whether this Apple Account has bought Pro.</p>

  <h2>10. Children</h2>
  <p>Nestbook is a tool for parents and carers, not an app for children to use themselves, and it is not in the Kids Category. Information about a child is entered by the adult using the app and is subject to everything above: it is not collected by us and it is not transmitted anywhere except through your own iCloud, if you enable it.</p>

  <h2>11. Deleting your data</h2>
  <p>Deleting a profile in the app deletes its projects, entries and photographs with it. Deleting the app removes the local database. If you had iCloud sync on, you can also remove Nestbook's data from iCloud in your device's own iCloud settings.</p>

  <h2>12. Not a medical device</h2>
  <p>Nestbook is a notebook for keeping records. It does not diagnose anything and it is not a medical device. Growth charts show published WHO or CDC reference channels for comparison only. If a number or a trend worries you, talk to your doctor.</p>

  <h2>13. Changes to this policy</h2>
  <p>If this policy changes, we will update this page and revise the "Last updated" date above. Material changes will be reflected before or at the time the corresponding app update is released.</p>

  <h2>14. Contact</h2>
  <p>Any question about this policy: <a href="mailto:thaidv@thaidang.net">thaidv@thaidang.net</a></p>

  <h2 id="tieng-viet">Chính sách quyền riêng tư — Nestbook</h2>
  <p class="meta">Cập nhật lần cuối: ngày 14 tháng 8 năm 2026</p>

  <h2>1. Tổng quan</h2>
  <p>Nestbook không thu thập gì cả. Không có tài khoản nào để tạo, không có server nào của chúng tôi để dữ liệu của bạn đi tới, không có analytics, và trong app không có mã theo dõi hay quảng cáo của bên thứ ba nào. Chính sách này ngắn vì thật sự có rất ít thứ để mô tả.</p>
  <p>Nestbook do Thai Dang Studio phát hành.</p>

  <h2>2. Thông tin chúng tôi thu thập</h2>
  <p>Không có. Chúng tôi không thu thập, không nhận, không lưu và không truyền bất kỳ thông tin cá nhân nào. Chúng tôi không vận hành server nào để app nói chuyện với, và trong app không có SDK analytics hay quảng cáo nào.</p>

  <h2>3. Thông tin lưu trên thiết bị của bạn</h2>
  <p>Mọi thứ bạn nhập nằm lại trong một cơ sở dữ liệu bên trong app trên máy bạn:</p>
  <ul>
    <li>các hồ sơ bạn tạo, cho con hoặc cho chính bạn, gồm tên, ngày sinh và giới tính (tuỳ chọn);</li>
    <li>các project bạn tạo từ mẫu có sẵn, và từng entry trong đó — số đo, điểm, buổi tập, thời gian luyện, ghi chú tự do;</li>
    <li>ảnh bạn đính kèm vào entry, được chép vào vùng lưu trữ riêng của app;</li>
    <li>những câu app tự viết, như một câu nhận xét dưới entry hay bản tổng kết tuần;</li>
    <li>cài đặt của bạn, như đơn vị đo, chuẩn tăng trưởng và lịch nhắc.</li>
  </ul>
  <p>Chúng tôi không có bản sao nào và không có cách nào đọc được.</p>

  <h2>4. Đồng bộ iCloud</h2>
  <p>Nếu bạn bật đồng bộ iCloud cho Nestbook, dữ liệu được đồng bộ qua iCloud <em>của chính bạn</em> bằng CloudKit private database của Apple, để các máy khác đăng nhập cùng Apple Account nhìn thấy. Phần đó do Apple xử lý theo <a href="https://www.apple.com/legal/privacy/">Chính sách quyền riêng tư của Apple</a>. Chúng tôi không bao giờ nhận được nó. Bạn tắt đồng bộ trong app lúc nào cũng được.</p>
  <p>Nếu Apple Account trên máy đổi, Nestbook dừng đồng bộ ngay và hỏi bạn muốn làm gì với dữ liệu đang có trên máy. Nó không bao giờ tự chuyển dữ liệu giữa các tài khoản.</p>

  <h2>5. AI chạy trên máy</h2>
  <p>Trên máy hỗ trợ Apple Intelligence, Nestbook có thể biến một câu bạn nói hoặc gõ thành form điền sẵn, viết một câu nhận xét dưới entry, tổng kết tuần, và đọc số từ ảnh. Tất cả chạy ngay trên máy bằng model on-device của Apple. Không một chữ, một đoạn âm thanh hay một tấm ảnh nào được gửi tới chúng tôi hay tới bất kỳ server nào. Máy không chạy được model thì các tính năng đó không có, còn mọi thứ khác vẫn y nguyên.</p>
  <p>App điền form để bạn kiểm. Nó không bao giờ tự lưu mà chưa hỏi bạn.</p>

  <h2>6. Chia sẻ, chỉ khi bạn yêu cầu</h2>
  <p>Nestbook không bao giờ tự gửi gì. Khi bạn chọn chia sẻ một project, nó dựng một file văn bản và cho bạn xem trọn nội dung trước. Mặc định file đó được ẩn danh: tên thật được thay, ảnh bị bỏ, số liệu giữ nguyên. Sau đó bạn chọn file đi đâu — app khác, tin nhắn, hay một trợ lý AI bạn tự chọn. Khi nó đã rời Nestbook, nó chịu điều khoản của dịch vụ bạn gửi tới.</p>

  <h2>7. Kết nối mạng</h2>
  <p>App không tự tạo kết nối mạng nào. Lưu lượng mạng duy nhất nó có thể gây ra là tới dịch vụ của chính Apple: iCloud, nếu bạn bật đồng bộ; App Store, để hỏi xem Apple Account này đã mua Nestbook Pro chưa; và dịch vụ push của Apple, thứ iCloud dùng để báo cho máy biết có gì đã đổi.</p>

  <h2>8. Quyền truy cập</h2>
  <p>Nestbook chỉ xin quyền đúng lúc bạn dùng tính năng cần tới, và bạn từ chối thì app vẫn chạy:</p>
  <ul>
    <li>thư viện ảnh và camera — để đính kèm hoặc chụp một tấm ảnh;</li>
    <li>micro và nhận dạng giọng nói — để đọc một câu thay vì gõ;</li>
    <li>thông báo — để nhắc bạn nhập liệu.</li>
  </ul>

  <h2>9. Mua Pro</h2>
  <p>Nestbook Pro là một lần mua, do Apple xử lý hoàn toàn. Chúng tôi không bao giờ thấy tên bạn, thông tin thanh toán hay Apple Account của bạn. App chỉ hỏi Apple xem Apple Account này đã mua Pro chưa.</p>

  <h2>10. Trẻ em</h2>
  <p>Nestbook là công cụ cho bố mẹ và người chăm, không phải app cho trẻ tự dùng, và không thuộc Kids Category. Thông tin về một đứa trẻ do người lớn dùng app nhập vào và chịu đúng mọi điều ở trên: chúng tôi không thu thập, và nó không được truyền đi đâu ngoài iCloud của chính bạn, nếu bạn bật.</p>

  <h2>11. Xoá dữ liệu</h2>
  <p>Xoá một hồ sơ trong app là xoá luôn project, entry và ảnh của hồ sơ đó. Xoá app là xoá cơ sở dữ liệu trên máy. Nếu bạn từng bật đồng bộ iCloud, bạn có thể xoá dữ liệu Nestbook khỏi iCloud trong phần Cài đặt iCloud của máy.</p>

  <h2>12. Không phải thiết bị y tế</h2>
  <p>Nestbook là sổ tay để ghi chép. Nó không chẩn đoán bất cứ điều gì và không phải thiết bị y tế. Biểu đồ tăng trưởng chỉ hiện dải tham chiếu WHO hoặc CDC đã công bố để so sánh. Con số hay xu hướng nào làm bạn lo, hãy trao đổi với bác sĩ.</p>

  <h2>13. Thay đổi chính sách</h2>
  <p>Nếu chính sách thay đổi, chúng tôi sẽ cập nhật trang này và sửa ngày cập nhật ở đầu tài liệu. Các thay đổi quan trọng sẽ được công bố trước hoặc cùng thời điểm phát hành bản cập nhật ứng dụng tương ứng.</p>
